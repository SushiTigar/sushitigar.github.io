# ─────────────────────────────────────────────────────────────
# GitHub Actions: Build & Deploy to GitHub Pages
# ─────────────────────────────────────────────────────────────
#
# Triggers on every push to master AND when Decap CMS commits
# content changes. Builds the Astro site and deploys the static
# output to GitHub Pages.
#
# Prerequisites:
#   1. Go to repo Settings → Pages → Source → "GitHub Actions"
#   2. That's it — no tokens needed.
#
# Docs: https://docs.astro.build/en/guides/deploy/github/
# ─────────────────────────────────────────────────────────────

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Grant GITHUB_TOKEN permission to deploy to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
